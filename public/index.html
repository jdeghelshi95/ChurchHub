<style>

--yes:#6fd79c;--yes-bg:#14352a;--no:#ff9a92;--no-bg:#40201e;--wait:#efc66a;--wait-bg:#3a2e12;--foh:#a9c4ff;--foh-bg:#1b2c58;--lyr:#ffa3a3;--lyr-bg:#4a1c1f;--liv:#ffbd8a;--liv-bg:#4c2b12;--cam:#86e3a8;--cam-bg:#123c25;--wir:#cdb4ff;--wir-bg:#322153;--pho:#ffa6d3;--pho-bg:#4f1a38;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--body)}
main{max-width:760px;margin:0 auto;padding-block:20px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:16px}

p{margin:0}.muted{color:var(--muted)}.small{font-size:14px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}

.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.grow{flex:1;min-width:0}

.code{font-size:24px;letter-spacing:.14em;width:100%;font-variant-numeric:tabular-nums}
.err{color:var(--no);font-weight:500}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}

details.date{border-top:1px solid var(--line);padding-block:10px}details.date:first-of-type{border-top:0}
summary{cursor:pointer;font-weight:600;display:flex;justify-content:space-between;gap:8px;align-items:center}
.slot{display:grid;grid-template-columns:118px minmax(0,1fr) auto;gap:8px;align-items:center;padding-block:5px}
.slot select{width:100%;min-height:40px;padding:6px}
.me{font-weight:600;color:var(--accent)}
.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%}th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td.num{font-variant-numeric:tabular-nums;letter-spacing:.06em}th{font-size:13px;color:var(--muted)}
.check{display:flex;gap:6px;align-items:center;min-height:32px}.check input{min-height:0;width:18px;height:18px}

.aslot{padding-block:10px}.aslot .who{font-weight:600;font-size:17px}
#rt th:first-child,#rt td:first-child{position:sticky;left:0;background:var(--panel)}#rt td,#rt th{text-align:center}#rt td:first-child,#rt th:first-child{text-align:left}#rt input{min-height:0;width:22px;height:22px}
.rt{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:7px;font-size:13px;font-weight:600;line-height:1.3;white-space:nowrap;background:var(--rb);color:var(--rc)}.slot .rt,.cue>.rt{justify-self:start}.slot .rt{white-space:normal}
.rt.on{background:var(--rc);color:var(--panel)}.arw{width:13px;height:13px;flex:none}
.line{border-left:4px solid var(--rc);border-radius:4px 9px 9px 4px;padding:6px 8px 6px 10px;margin-block:5px}.line.mine{background:var(--rb)}.line.mine .me{color:var(--rc);font-weight:700}
.legend{display:flex;flex-wrap:wrap;gap:6px}.setup{display:block;font:700 22px/1.2 var(--display);color:var(--accent)}summary{flex-wrap:wrap}summary .setup{order:3;flex-basis:100%}
.slot.aslot{grid-template-columns:auto minmax(0,1fr)}
.shot{display:block;width:100%;max-width:440px;height:auto;margin-inline:auto;border-radius:12px;border:1px solid var(--line)}
.st td:not(:first-child),.st th:not(:first-child){text-align:center;font-variant-numeric:tabular-nums}
.sizes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}.sizes button[aria-pressed=true]{background:var(--foh);color:var(--panel);border-color:transparent;font-weight:700}
.guide{display:grid;gap:8px;padding-block:12px;border-top:1px solid var(--line);min-width:0}.guide:first-of-type{border-top:0;padding-top:0}.guide .note{white-space:pre-line}
.vid{display:block;width:100%;aspect-ratio:16/9;border:0;border-radius:10px;background:#000}
@media (max-width:480px){.slot{grid-template-columns:88px minmax(0,1fr) auto;gap:6px}.slot .rt{padding-inline:6px}}
.c-foh{--rc:var(--foh);--rb:var(--foh-bg)}.c-lyr{--rc:var(--lyr);--rb:var(--lyr-bg)}.c-liv{--rc:var(--liv);--rb:var(--liv-bg)}.c-cam{--rc:var(--cam);--rb:var(--cam-bg)}.c-wir{--rc:var(--wir);--rb:var(--wir-bg)}.c-pho{--rc:var(--pho);--rb:var(--pho-bg)}
.day{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;font-weight:500}
/* Check and cross marks, name chips, grouped navigation and the attendance chart. */
.ic{width:13px;height:13px;flex:none;vertical-align:-2px;margin-right:3px}
.chips{display:flex;flex-wrap:wrap;gap:6px}.pill.solid{background:var(--yes);color:var(--panel)}
.marks{display:grid;gap:6px;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
.nav{display:grid;gap:8px}
.groups{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);border:1px solid var(--line);border-radius:11px;overflow:hidden;background:var(--panel)}
.groups button{border:0;border-radius:0;font:600 18px/1.1 var(--display);padding:8px 6px}.groups button+button{border-left:1px solid var(--line)}
.groups button[aria-pressed=true]{background:var(--accent);color:var(--on-accent)}.groups button:focus-visible{outline-offset:-3px}
.subs{display:flex;gap:6px;flex-wrap:wrap}.subs button{min-height:38px;padding:6px 13px;border-radius:99px;font-weight:500}
.subs button[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:var(--bg);font-weight:600}
.bars{display:grid;gap:8px}.bar{display:grid;grid-template-columns:38px minmax(0,1fr) 28px;gap:8px;align-items:center}
.track{display:flex;gap:2px;height:18px}.seg{border-radius:4px;min-width:5px}.bar b{font-variant-numeric:tabular-nums;text-align:right}
.sP{background:var(--yes)}.sT{background:var(--wait)}.sM{background:var(--no)}.sE{background:var(--muted)}.sU{background:var(--line)}
.key{display:flex;flex-wrap:wrap;gap:4px 14px}.key i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
.hist{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 8px;align-items:center;padding-block:7px;border-top:1px solid var(--line)}.hist:first-of-type{border-top:0}
/* A volunteer's own dates, and the month calendar for marking days. */
.mydate{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px 12px;padding-block:14px;border-top:1px solid var(--line)}.mydate:first-of-type{border-top:0;padding-top:0}
.mydate>.choices,.mydate>.row,.mydate>p{grid-column:1/-1}.mydate .info{display:grid;gap:4px;justify-items:start;align-content:center}
.dblock{width:62px;border-radius:10px;border:1px solid var(--line);text-align:center;padding:6px 0;align-self:start;line-height:1.1}
.dblock small{display:block;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}.dblock b{display:block;font:700 30px/1 var(--display)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center}.cal .wd{font-size:12px;font-weight:600;color:var(--muted)}
.cal .c{min-height:52px;border-radius:9px;display:grid;place-items:center;align-content:center;gap:2px;padding:2px;font-weight:600;font-variant-numeric:tabular-nums}
.cal span.c{color:var(--muted);font-weight:400;opacity:.55}.cal button.c{border:1px dashed var(--line)}.cal .c .ic{margin:0}.cal .c i{height:13px}
.cal .ok{background:var(--yes-bg);color:var(--yes);border:1px solid transparent}.cal .cant{background:var(--no-bg);color:var(--no);border:1px solid transparent}.cal .shut{background:var(--wait-bg);color:var(--wait);border:1px solid transparent;opacity:1}
.cal .sch{box-shadow:inset 0 0 0 2px var(--accent)}
.key .sw{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:5px;margin-right:5px;vertical-align:-4px}.key .sw .ic{margin:0;width:11px;height:11px}
.thanks{grid-column:1/-1;display:grid;gap:8px;background:var(--yes-bg);border-radius:11px;padding:12px}
.thanks .done{display:flex;align-items:center;justify-content:center;gap:6px;background:var(--yes);color:var(--panel);border-radius:9px;min-height:44px;font-weight:700}.thanks .done .ic{width:18px;height:18px}
.thanks blockquote{margin:0;font-style:italic}.thanks cite{display:block;font-style:normal;font-weight:600;font-size:14px;margin-top:2px}
.cal span.c.free{background:var(--foh-bg);color:var(--foh);border:1px solid transparent;opacity:1;font-weight:600}.cal span.c.asg{background:var(--yes);color:var(--panel);border:1px solid transparent;opacity:1;font-weight:700}
.cal span.c.cant{opacity:1;font-weight:600}.calnav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.st td:nth-child(2),.st th:nth-child(2){text-align:left}.st .hot{background:var(--rb);color:var(--rc);font-weight:700}.st td.rank{color:var(--muted);text-align:right;padding-right:0}
.vP{--rc:var(--yes);--rb:var(--yes-bg)}.vT{--rc:var(--wait);--rb:var(--wait-bg)}.vM{--rc:var(--no);--rb:var(--no-bg)}.vE{--rc:var(--foh);--rb:var(--foh-bg)}
.tabs button.vP[aria-pressed=true],.tabs button.vT[aria-pressed=true],.tabs button.vM[aria-pressed=true],.tabs button.vE[aria-pressed=true]{background:var(--rc);border-color:var(--rc);color:var(--panel)}
.top3{display:grid;gap:6px}.top3 div{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:8px;align-items:center;background:var(--rb);border-radius:9px;padding:8px 10px}.top3 b{color:var(--rc);font:700 22px/1 var(--display)}
.alert{position:sticky;top:8px;z-index:5;display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;background:var(--wait-bg);color:var(--wait);border:2px solid var(--wait);border-radius:12px;padding:10px 12px;font-weight:600;box-shadow:0 4px 14px rgb(0 0 0/.15)}
.alert svg{width:22px;height:22px;flex:none}.alert span{flex:1;min-width:150px}.alert button{background:var(--wait);color:var(--panel);border-color:var(--wait)}
.land{display:grid;justify-items:center;gap:10px;text-align:center;padding-block:20px 4px}.logo{width:min(230px,62vw);height:auto;color:var(--ink)}
.lbl{font-weight:600;margin-bottom:-6px}.field{width:100%;font-size:18px}
/* Kids Ministry: chat, pickup pass, and printed labels. */
.chat{display:grid;gap:8px;max-height:46vh;overflow-y:auto;padding:4px}.msg{justify-self:start;max-width:85%;background:var(--bg);border-radius:12px;padding:8px 11px;overflow-wrap:anywhere}.msg.me{justify-self:end;background:var(--foh-bg)}
.pass{text-align:center;border:2px solid var(--yes)}.pass .row{text-align:left}.qr{justify-self:center;width:170px;background:#fff;padding:10px;border-radius:10px;margin-inline:auto}.qr svg{display:block;width:100%;height:auto}
.bigcode{font:700 56px/1 var(--display);letter-spacing:.14em;font-variant-numeric:tabular-nums}
.kidpick{border:1px solid var(--line);border-radius:10px;padding:10px 12px;gap:12px;min-height:52px}.kidpick input{width:22px;height:22px;flex:none}
.alert.pick{background:var(--no-bg);color:var(--no);border-color:var(--no);font-size:18px}
#printarea{display:none}
.label{display:grid;grid-template-columns:1fr auto;gap:3mm;align-items:center;width:58mm;padding:2mm;page-break-after:always;break-after:page;font:500 10pt/1.25 var(--body);color:#000;background:#fff}
.label.big{width:90mm;font-size:13pt}.label.big .lname{font-size:30pt}.label.big .lcode,.label.big .lcode svg{width:28mm}.label.big .lcode svg{height:28mm}
.lhead{grid-column:1/-1;font:700 9pt/1.1 var(--body);letter-spacing:.06em;text-transform:uppercase;border-bottom:1pt solid #000;padding-bottom:1mm}
.lname{font:700 22pt/1 var(--display)}.lwarn{border:1.5pt solid #000;padding:0 1.5mm;font-weight:700;display:block;width:fit-content;margin-block:1mm}.lsmall{font-size:8pt}
.lcode{display:grid;justify-items:center;gap:1mm;width:20mm}.lcode svg{width:20mm;height:20mm}.lcode b{font:700 14pt/1 var(--display);letter-spacing:.08em}
.lprev{overflow-x:auto;padding:10px;background:var(--bg);border-radius:10px}.lprev .label{border:1px dashed #888;border-radius:4px;margin-inline:auto}
main>.groups{margin-bottom:-4px}
.groups.cats button{font-size:17px;min-height:40px}.groups.cats button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
@media print{body{background:#fff;color:#000}#app>*:not(#printarea),#toast{display:none!important}main{padding:0;max-width:none;display:block}#printarea{display:block}
.poster{text-align:center;padding:20mm 10mm;font-size:16pt}.poster h1{font-size:40pt;margin-bottom:6mm}.poster svg{width:110mm;height:110mm;margin:10mm auto;display:block}}
@page{margin:3mm}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--ink) 88%,transparent);color:var(--bg);padding:11px 18px;border-radius:999px;max-width:90vw;font-weight:500;z-index:20;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:0 8px 30px rgb(0 0 0/.18)}
/* ---------- Look and feel ---------- */
body{font-size:16px;line-height:1.47;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}

.bar svg{width:24px;height:24px}body:has(.land) .bar{display:none}.alert{top:62px}
.panel{border:0;border-radius:20px;padding:20px;gap:14px;box-shadow:var(--shadow)}
@media (prefers-color-scheme:dark){.panel{border:1px solid var(--line)}}

.pill{padding:3px 10px}.rt{border-radius:8px}

.stats{gap:10px}.stats b{font-size:32px;letter-spacing:-.03em}
.day{border-radius:14px;padding:12px 14px;text-align:left}.kidpick{border-radius:14px;border-color:var(--line)}
.choices button,.att button,.sizes button,.thanks .done{border-radius:14px}.thanks{border-radius:16px;padding:14px}

.setup{font-size:19px;letter-spacing:-.02em}.bigcode{letter-spacing:.1em}
.line{border-radius:6px 12px 12px 6px}.slot select{border-radius:10px}
th{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}td,th{padding:10px 8px}
.msg{border-radius:18px;padding:9px 14px}.msg.me{background:var(--accent);color:var(--on-accent)}.msg.me .muted{color:inherit;opacity:.8}
.vid,.shot{border-radius:16px}.qr{border-radius:16px;box-shadow:var(--shadow)}
main:has(.land){max-width:440px;padding-top:max(24px,6vh)}.land{gap:14px;padding-block:8px 6px}.logo{width:min(210px,56vw)}.land .muted{font-size:17px}
.field{font-size:17px;min-height:50px}.lbl{font-size:14px;color:var(--muted);margin-bottom:-8px}
main:has(.land) button.primary,main:has(.land) #parents{min-height:50px;font-size:17px}
input[type=month],input[type=date]{min-width:150px}.choices button{padding-inline:8px}
@media (max-width:420px){.groups button{font-size:14px}}
/* Eight colour themes. Teal is the default; each has a lighter version for dark mode. */
[data-theme=blue]{--accent:#0064d1}[data-theme=indigo]{--accent:#4b4acf}[data-theme=purple]{--accent:#7a2fd0}[data-theme=pink]{--accent:#c2255c}[data-theme=red]{--accent:#c62828}[data-theme=orange]{--accent:#b84a00}[data-theme=green]{--accent:#1b7a3d}[data-theme=teal]{--accent:#0a6f82}
@media (prefers-color-scheme:dark){[data-theme=teal]{--accent:#5ac8d8}[data-theme=blue]{--accent:#6cb2ff}[data-theme=indigo]{--accent:#a5a4ff}[data-theme=purple]{--accent:#c9a5ff}[data-theme=pink]{--accent:#ff8fb3}[data-theme=red]{--accent:#ff8a80}[data-theme=orange]{--accent:#ffb072}[data-theme=green]{--accent:#6fd79c}[data-theme]{--on-accent:#0b0b0f}}
:root{--glow:0 0 0 1px color-mix(in srgb,var(--accent) 55%,transparent),0 6px 22px color-mix(in srgb,var(--accent) 38%,transparent)}
/* Top bar: brand in the middle, colour button on the right. */
.bar{padding-inline:12px}.brand{display:flex;align-items:center;gap:8px}
.bar>button{position:absolute;right:max(12px,env(safe-area-inset-right,0px));width:40px;height:40px;min-height:0;padding:0;display:grid;place-items:center;background:none;color:var(--muted)}
.bar>button:hover,.bar>button[aria-expanded=true]{background:var(--fill);color:var(--accent);filter:none}.bar>button svg{width:22px;height:22px}
.pop{position:absolute;z-index:15;background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 50px rgb(0 0 0/.2);padding:12px;animation:pop .18s ease both;transform-origin:top right}
#themes{top:54px;right:max(10px,env(safe-area-inset-right,0px));display:grid;gap:10px;font-weight:500}#themes[hidden]{display:none}
.swatches{display:grid;grid-template-columns:repeat(4,40px);gap:10px}
.swatches button{width:40px;height:40px;min-height:0;padding:0;border-radius:50%;background:var(--accent);border:3px solid var(--panel);box-shadow:0 0 0 1px var(--line)}
.swatches button:hover{transform:scale(1.1);filter:none}.swatches button[aria-pressed=true]{box-shadow:0 0 0 2px var(--accent),0 0 16px color-mix(in srgb,var(--accent) 60%,transparent)}
/* Ministry switcher. */
.mswitch{position:relative;justify-self:start}
.mbtn{display:flex;align-items:center;gap:10px;background:var(--panel);font-size:17px;font-weight:600;letter-spacing:-.01em;padding:9px 14px 9px 12px;min-height:48px;box-shadow:var(--shadow);border-color:var(--line)}
.mbtn:hover,.mbtn[aria-expanded=true]{border-color:var(--accent);box-shadow:var(--glow);filter:none}
.mico{width:24px;height:24px;flex:none;color:var(--accent)}.chev{width:16px;height:16px;color:var(--muted);transition:transform .2s ease}.mbtn[aria-expanded=true] .chev{transform:rotate(180deg)}
.mmenu{position:absolute;z-index:15;top:calc(100% + 8px);left:0;min-width:230px;display:grid;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 50px rgb(0 0 0/.2);padding:6px;animation:pop .18s ease both;transform-origin:top left}
.mmenu[hidden]{display:none}
.mmenu button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border-radius:12px;padding:10px 12px;font-weight:500;font-size:16px}
.mmenu button:hover{background:var(--fill);filter:none;transform:none}.mmenu button[aria-current]{background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--accent);font-weight:600}
.mmenu .ic{width:16px;height:16px;margin:0}
/* Active controls glow in the theme colour; everything lifts slightly on hover. */
.subs button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--on-accent);box-shadow:var(--glow)}
.tabs button[aria-pressed=true],button.primary:not([disabled]):hover{box-shadow:var(--glow)}
.subs button:not([aria-pressed=true]):hover,.groups button:not([aria-pressed=true]):hover{color:var(--ink);background:var(--fill);filter:none}
.groups button[aria-pressed=true],.groups.cats button[aria-pressed=true]{color:var(--accent);box-shadow:0 1px 3px rgb(0 0 0/.12),0 0 0 1px color-mix(in srgb,var(--accent) 35%,transparent),0 4px 14px color-mix(in srgb,var(--accent) 22%,transparent)}
.panel{transition:box-shadow .2s ease,transform .2s ease}
@media (hover:hover){.day:hover{background:color-mix(in srgb,var(--accent) 10%,var(--fill))}}
/* New pages fade and rise in, one block after another. */
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.96) translateY(-4px)}to{opacity:1;transform:none}}
#app[data-enter]>*{animation:rise .38s cubic-bezier(.2,.7,.2,1) both}
#app[data-enter]>*:nth-child(2){animation-delay:.04s}#app[data-enter]>*:nth-child(3){animation-delay:.08s}#app[data-enter]>*:nth-child(4){animation-delay:.12s}#app[data-enter]>*:nth-child(n+5){animation-delay:.16s}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
@media (min-width:800px){main{padding-top:36px}.panel{padding:24px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{.bar{display:none}}
</style>
</head>
<body>
<header class="bar"><span class="brand"><svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="var(--accent)"/><path d="M9 31 32 12l23 19" fill="none" stroke="var(--on-accent)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M32 28v24M23 37h18" fill="none" stroke="var(--on-accent)" stroke-width="6.5" stroke-linecap="round"/></svg>Church Hub</span>
<button id="themebtn" aria-label="Colour theme" aria-expanded="false" aria-controls="themes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.800" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18c1.400 0 2-1 2-2 0-1.500-1-2 0-3 .600-.600 1.500-.500 2.500-.500A4.500 4.500 0 0 0 21 11c0-4.400-4-8-9-8z"/><circle cx="7.800" cy="11.500" r="1"/><circle cx="10.500" cy="7.500" r="1"/><circle cx="15" cy="7.800" r="1"/></svg></button>
<div id="themes" class="pop" hidden></div></header>
<main id="app"><p class="muted">Loading the schedule&hellip;</p></main>
<div id="toast" role="status" hidden></div>
<script src="/qrcode.js" defer></script>
<script src="/kids.js" defer></script>
<script src="/band.js" defer></script>
<script src="/app.js" defer></script>
</body>
</html>
